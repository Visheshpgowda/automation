name: Daily Diary Bot

on:
  schedule:
    - cron: '0 4 * * *'   # Runs daily at 4 AM UTC
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install --with-deps

      - run: node index.js